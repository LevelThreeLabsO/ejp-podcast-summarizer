name: probe gemini video tier
on:
  workflow_dispatch:
    inputs:
      url:
        description: YouTube URL to summarize via the Gemini video tier
        required: true
      skip_gemini_video:
        description: Set to 1 to bypass tier 2 and test the ClipMaker transcript path instead
        required: false
        default: ""
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Dry-run one URL
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YT_TRANSCRIPT_IO_TOKEN: ${{ secrets.YT_TRANSCRIPT_IO_TOKEN }}
          YT_QUOTA_ALERT_CHANNEL: ${{ secrets.YT_QUOTA_ALERT_CHANNEL }}
          SKIP_GEMINI_VIDEO: ${{ inputs.skip_gemini_video }}
          # CLIPMAKER is passed ONLY so the transcript path can be compared
          # against the Gemini video tier. With skip_gemini_video empty, tier 2
          # answers first and ClipMaker is never reached.
          CLIPMAKER_URL: ${{ secrets.CLIPMAKER_URL }}
          CLIPMAKER_AUTH_TOKEN: ${{ secrets.CLIPMAKER_AUTH_TOKEN }}
        run: python3 -u poll.py --url "${{ inputs.url }}"
